name: Prepare reviewed Studio v3
on:
  push:
    branches: [release/studio-v3-audit]
    paths: ['.release/v3.ready']
permissions:
  contents: write
concurrency:
  group: nicho-studio-v3-prepare
  cancel-in-progress: false
jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unpack reviewed source with integrity and path checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          root=Path.cwd().resolve()
          manifest=json.loads((root/'.release/v3.ready').read_text())
          parts=[root/f'.release/part-{i:02d}.b64' for i in range(1,manifest['parts']+1)]
          encoded=''.join(''.join(p.read_text().split()) for p in parts)
          raw=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(raw).hexdigest()!=manifest['sha256']:
              raise SystemExit('Release transport integrity check failed')
          payload=json.loads(lzma.decompress(raw,memlimit=268435456))
          if payload.get('format')!=1:raise SystemExit('Unsupported source bundle')
          for name,content in payload['files'].items():
              target=(root/name).resolve()
              allowed=name.startswith(('assets/v3/','scripts/','tests/','data/')) or name in ['.github/workflows/quality.yml','README.md','SEO-IMPLEMENTACION-V3.md','AUDITORIA-V3.md','requirements-build.txt','.gitignore']
              if not allowed or not target.is_relative_to(root) or len(content)>250000:
                  raise SystemExit('Unexpected source path or size: '+name)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
          print('Verified and unpacked',len(payload['files']),'reviewed text source files')
          PY
      - name: Install build and browser dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m playwright install --with-deps chromium
      - name: Prepare licensed-media derivatives and pinned libraries
        run: |
          python scripts/prepare_vendor.py
          python scripts/prepare_assets.py
      - name: Generate complete static site and validate SEO
        run: |
          python scripts/build.py
          python scripts/validate.py
      - name: HTTP browser test of all pages and interactions
        run: |
          python -m http.server 8765 >/tmp/nicho-http.log 2>&1 &
          python tests/browser_check.py --base http://127.0.0.1:8765
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lighthouse mobile laboratory report
        continue-on-error: true
        run: |
          CHROME_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          export CHROME_PATH
          npx --yes lighthouse@13.4.1 http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet --output=json --output-path=reports/lighthouse-mobile.json
      - name: Read-only public HTTPS diagnostic
        if: always()
        run: |
          if test -f scripts/health.py; then python scripts/health.py; fi
      - name: Commit generated and validated source on review branch only
        run: |
          python - <<'PY'
          from pathlib import Path
          # Remove only superseded design layers. Public URLs and CNAME remain.
          names=['styles.css','site.js','hyper-nicho.css','hyper-nicho.js','brand-nicho.css','seo-nicho.css','nicho-studio.css','nicho-studio.js','portfolio-experience.css','portfolio-experience.js','nicho-experience.css','nicho-experience.js']
          for name in names:(Path('assets')/name).unlink(missing_ok=True)
          for p in Path('.release').glob('*'):
              if p.is_file():p.unlink()
          Path('.release').rmdir()
          Path('.github/workflows/prepare-studio-v3.yml').unlink()
          PY
          git config user.name 'Nicho release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish validated Studio v3 source, artwork, SEO and tests'
          git push origin HEAD:release/studio-v3-audit
      - name: Upload independent test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nicho-studio-v3-audit
          path: reports/
          retention-days: 14
