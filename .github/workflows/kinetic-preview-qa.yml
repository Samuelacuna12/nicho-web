name: Validar exploracion KINETIC
on:
  push:
    branches: [audit/kinetic-reference]
    paths: [exploracion-kinetic.html, .github/workflows/kinetic-preview-qa.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar navegador
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Probar y grabar sin modificar la portada
        run: |
          python - <<'PY'
          import functools,http.server,threading,pathlib,json,time,shutil
          from playwright.sync_api import sync_playwright
          root=pathlib.Path.cwd(); out=pathlib.Path('/tmp/kinetic-preview');out.mkdir()
          handler=functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root))
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          report={'viewports':[],'errors':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width,height in [(1440,960),(1024,900),(390,844)]:
                  ctx=browser.new_context(viewport={'width':width,'height':height},device_scale_factor=1,reduced_motion='no-preference',record_video_dir=str(out/'video') if width==1440 else None,record_video_size={'width':1440,'height':960} if width==1440 else None)
                  page=ctx.new_page();page.on('pageerror',lambda e:report['errors'].append(str(e)))
                  page.goto('http://127.0.0.1:8765/exploracion-kinetic.html',wait_until='networkidle');page.wait_for_timeout(2400)
                  page.screenshot(path=str(out/f'hero-{width}.png'))
                  row={'width':width,'overflow':page.evaluate('document.documentElement.scrollWidth>innerWidth+1'),'triggers':page.evaluate('ScrollTrigger.getAll().length')}
                  page.locator('.intro').scroll_into_view_if_needed();page.wait_for_timeout(1300)
                  page.locator('#proyectos').scroll_into_view_if_needed();page.wait_for_timeout(1900)
                  page.screenshot(path=str(out/f'projects-{width}.png'))
                  page.evaluate('NICHO_KINETIC.select(0,true)');page.wait_for_timeout(850)
                  page.locator('#next').click();page.wait_for_timeout(950)
                  row['next_project']=page.locator('#project-title').inner_text()
                  assert row['next_project']=='RestoOps',row
                  page.screenshot(path=str(out/f'gallery-next-{width}.png'))
                  page.locator('#como').scroll_into_view_if_needed();page.wait_for_timeout(1100)
                  for step in range(9):
                      page.evaluate('window.scrollBy(0,110)');page.wait_for_timeout(210)
                  page.screenshot(path=str(out/f'process-{width}.png'))
                  page.locator('#servicios').scroll_into_view_if_needed();page.wait_for_timeout(1000)
                  page.locator('.closing').scroll_into_view_if_needed();page.wait_for_timeout(800)
                  page.evaluate('window.scrollTo(0,0)');page.wait_for_timeout(1000)
                  page.locator('#motion').click();page.wait_for_timeout(500)
                  row['pause_works']=page.evaluate('NICHO_KINETIC.motion()===false')
                  assert row['pause_works']
                  page.screenshot(path=str(out/f'full-{width}.png'),full_page=True)
                  report['viewports'].append(row)
                  recording=page.video
                  page.close();ctx.close()
                  if width==1440 and recording:recording.save_as(str(out/'kinetic-preview.webm'))
              ctx=browser.new_context(viewport={'width':390,'height':844},reduced_motion='reduce')
              page=ctx.new_page();page.goto('http://127.0.0.1:8765/exploracion-kinetic.html');page.wait_for_timeout(1000)
              report['reduced_motion']=page.evaluate('!NICHO_KINETIC.motion() && ScrollTrigger.getAll().length===0')
              ctx.close();browser.close()
          shutil.copy2(root/'exploracion-kinetic.html',out/'exploracion-kinetic.html')
          (out/'qa.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2))
          assert not report['errors'], report['errors']
          assert not any(x['overflow'] for x in report['viewports'])
          assert report['reduced_motion']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nicho-kinetic-preview-qa
          path: /tmp/kinetic-preview
          retention-days: 3
