name: Inspeccionar motion reel KINETIC
on:
  push:
    branches: [audit/kinetic-reference]
    paths: [.github/workflows/kinetic-media-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar referencias del autor para analisis
        run: |
          mkdir -p /tmp/kinetic-media
          python - <<'PY'
          import urllib.request,pathlib,json
          root=pathlib.Path('/tmp/kinetic-media')
          files={
            'motion.mp4':'https://cdn.dribbble.com/userupload/47245869/file/d4f60a5ba70ef4d49c604b7f870d3bd8.mp4',
            'layout.png':'https://cdn.dribbble.com/userupload/47245871/file/727704fd5bd472e33ed907058a441afc.png',
            'strip.png':'https://cdn.dribbble.com/userupload/47245870/file/7087845371e315fbf065296ff70db814.png',
            'cover.png':'https://cdn.dribbble.com/userupload/47245867/file/5f74f42e2bd1e5ac91e93017bc895543.png'
          }
          for name,url in files.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=60) as r:data=r.read(65000000)
                  (root/name).write_bytes(data)
                  print(name,len(data),url)
              except Exception as e:print('ERROR',name,str(e))
          (root/'sources.json').write_text(json.dumps(files,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinetic-author-media-analysis
          path: /tmp/kinetic-media
          retention-days: 1
